# cSpell:disable
openapi: 3.0.3
info:
  title: BigoBooks API
  version: 1.0.0
paths: {}
components:
  schemas:
    SalesStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - CANCELLED
        - RETURNED
    AuthorRole:
      type: string
      enum:
        - WRITER
        - ILLUSTRATOR
        - TRANSLATOR
        - EDITOR
    UserAccountDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        roleId:
          type: integer
          format: int64
        wishlist:
          type: array
          items:
            $ref: '#/components/schemas/WishlistItemDto'
    RoleDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PermissionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    RolePermissionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        roleId:
          type: integer
          format: int64
        permissionId:
          type: integer
          format: int64
    WishlistItemDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
    BookDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        coverUrl:
          type: string
        title:
          type: string
        description:
          type: string
        genreIds:
          type: array
          items:
            type: integer
            format: int64
        authorIds:
          type: array
          items:
            type: integer
            format: int64
        promotionIds:
          type: array
          items:
            type: integer
            format: int64
    GenreDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    AuthorDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    BookGenreDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        genreId:
          type: integer
          format: int64
        isPrimary:
          type: boolean
    BookAuthorDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/AuthorRole'
    PromotionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        discount:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        bookIds:
          type: array
          items:
            type: integer
            format: int64
    BookPromotionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        promotionId:
          type: integer
          format: int64
        maxUnitsDiscount:
          type: integer
    SaleDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SalesStatus'
        totalPrice:
          type: integer
        createdAt:
          type: string
          format: date-time
        saleDetails:
          type: array
          items:
            $ref: '#/components/schemas/SaleDetailDto'
        saleCoupons:
          type: array
          items:
            $ref: '#/components/schemas/SaleCouponDto'
    SaleDetailDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        quantity:
          type: integer
        price:
          type: integer
          format: int64
        saleId:
          type: integer
          format: int64
    SaleCouponTemplateDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        discountPercentage:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        maxUses:
          type: integer
        maxDiscountAmount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    SaleCouponDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        saleId:
          type: integer
          format: int64
        couponTemplateId:
          type: integer
          format: int64
        discountPercentage:
          type: integer
        discountAmount:
          type: integer
          format: int64
        appliedAt:
          type: string
          format: date-time
    RentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SalesStatus'
        totalPrice:
          type: integer
        createdAt:
          type: string
          format: date-time
        rentDetails:
          type: array
          items:
            $ref: '#/components/schemas/RentDetailDto'
        rentCoupons:
          type: array
          items:
            $ref: '#/components/schemas/RentCouponDto'
    RentDetailDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        price:
          type: integer
          format: int64
        monthsRented:
          type: integer
        returnDate:
          type: string
          format: date
        rentId:
          type: integer
          format: int64
    RentExtensionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        rentDetailId:
          type: integer
          format: int64
        monthsExtended:
          type: integer
        extraPrice:
          type: integer
          format: int64
        newReturnDate:
          type: string
          format: date
    RentCouponTemplateDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        discountPercentage:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        maxUses:
          type: integer
        maxDiscountAmount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    RentCouponDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        rentId:
          type: integer
          format: int64
        couponTemplateId:
          type: integer
          format: int64
        discountPercentage:
          type: integer
        discountAmount:
          type: integer
          format: int64
        appliedAt:
          type: string
          format: date-time