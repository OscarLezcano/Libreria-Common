# cSpell:disable
openapi: 3.0.3
info:
  title: BigoBooks API
  version: 1.0.0
paths: {}
components:
  schemas:
    UserAccountDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
        city:
          type: string
        warehouseId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        roleId:
          type: integer
          format: int64
        wishlist:
          type: array
          items:
            $ref: '#/components/schemas/BookDto'
    RoleDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionDto'
    PermissionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    RegisterDto:
      type: object
      properties:
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
        city:
          type: string
        warehouseId:
          type: integer
          format: int64
    LoginDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    BookDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        coverUrl:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
          description: Precio de venta en guaranies (null si aun no tiene precio)
        createdAt:
          type: string
          format: date-time
        genreIds:
          type: array
          items:
            type: integer
            format: int64
        authorIds:
          type: array
          items:
            type: integer
            format: int64
    GenreDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    AuthorDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    OrderDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        warehouseId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
          description: Usuario que realizo la venta (null si no tiene usuario)
        status:
          type: string
          enum:
            - PENDING
            - PAID
            - REFUNDED
            - CANCELLED
        totalPrice:
          type: integer
          format: int64
        subtotal:
          type: integer
          format: int64
        discountAmount:
          type: integer
          format: int64
        bancardNumber:
          type: string
        invoiceNumber:
          type: string
        createdAt:
          type: string
          format: date-time
        couponId:
          type: integer
          format: int64
        orderDetails:
          type: array
          items:
            $ref: '#/components/schemas/OrderDetailDto'
    OrderDetailDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        bookName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer
          format: int64
        discount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        orderId:
          type: integer
          format: int64
    CouponDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        discountPercent:
          type: integer
        validUntil:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    SupplierDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        ruc:
          type: string
        createdAt:
          type: string
          format: date-time
    PurchaseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        warehouseId:
          type: integer
          format: int64
        supplierId:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - PENDING
            - RECEIVED
            - CANCELLED
        totalPrice:
          type: integer
        invoiceNumber:
          type: string
        createdAt:
          type: string
          format: date-time
        purchaseDetails:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseDetailDto'
    PurchaseDetailDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        bookName:
          type: string
        quantity:
          type: integer
        unitCost:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        purchaseId:
          type: integer
          format: int64
    WarehouseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        city:
          type: string
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
        stocks:
          type: array
          items:
            $ref: '#/components/schemas/StockDto'
    StockDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        quantity:
          type: integer
        createdAt:
          type: string
          format: date-time
        warehouseId:
          type: integer
          format: int64
    StockAdjustmentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        warehouseId:
          type: integer
          format: int64
        details:
          type: array
          items:
            $ref: '#/components/schemas/StockAdjustmentDetailDto'
    StockAdjustmentDetailDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        book:
          type: integer
          format: int64
        bookName:
          type: string
        systemQuantity:
          type: integer
        physicalQuantity:
          type: integer
        createdAt:
          type: string
          format: date-time
        stockAdjustmentId:
          type: integer
          format: int64
